# Chạy trong repo public twoofwn/tron-landing (thư mục landing/ của repo tron
# được đẩy sang làm gốc). Đăng trang giới thiệu + file APK lên GitHub Pages.
name: Deploy landing page

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Check APK
        run: |
          test -s downloads/tron.apk
          ls -lh downloads/tron.apk

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
